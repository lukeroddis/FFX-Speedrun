<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Skips – Final Fantasy X Speedrun</title>
<link rel="icon" type="image/png" sizes="32x32" href="../assets/logo/icon-32.png">
<link rel="icon" type="image/png" sizes="192x192" href="../assets/logo/icon-192.png">
<link rel="apple-touch-icon" href="../assets/logo/apple-touch-icon.png">
<meta name="description" content="A library of skip tutorials for Final Fantasy X speedruns, with videos and detailed explanations and imagery.">
<link href="https://fonts.googleapis.com/css2?family=Ubuntu:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../assets/hub.css">
<script src="../assets/notes-config.js"></script>
<script src="../assets/hub.js"></script>
</head>
<body>
<div class="page-head"><div class="wrap"><h1>Skips</h1><p>A library of skip tutorials for Final Fantasy X speedruns, with videos and detailed explanations and imagery.</p></div></div>
<main class="wrap">
<div class="grid" id="skips"><p class="muted">Loading…</p></div>
</main>
<script>
(async () => {
  Hub.nav("skips");
  Hub.footer();
  const $ = id => document.getElementById(id), esc = Hub.esc;
  const skips = await Hub.skips();
  $("skips").innerHTML = !skips ? Hub.notBuilt : skips.map(Hub.skipCardHTML).join("") || `<p class="muted">No skips yet.</p>`;
})();
</script>
</body>
</html>
