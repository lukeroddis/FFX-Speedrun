<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Notes – Final Fantasy X Speedrun</title>
<link rel="icon" type="image/png" sizes="32x32" href="../assets/logo/icon-32.png">
<link rel="icon" type="image/png" sizes="192x192" href="../assets/logo/icon-192.png">
<link rel="apple-touch-icon" href="../assets/logo/apple-touch-icon.png">
<meta name="description" content="Final Fantasy X speedrun notes by category and language.">
<link rel="stylesheet" href="../assets/hub.css">
<script src="../assets/notes-config.js"></script>
<script src="../assets/hub.js"></script>
</head>
<body>
<div class="page-head"><div class="wrap"><h1>Notes</h1><p>Step-by-step notes for each category. Filter the notes by category or language.</p></div></div>
<main class="wrap">
<div class="grid" id="cats"><p class="muted">Loading…</p></div>
</main>
<script>
(async () => {
  Hub.nav("notes");
  Hub.footer();
  const $ = id => document.getElementById(id), esc = Hub.esc;
  let langNames = {};
  langNames = (await NotesConfig.loadGlossary()).languages;
  const [cats, boards] = await Promise.all([Hub.categories(), Hub.boards().catch(() => [])]);
  const boardName = id => boards.find(b => b.id === id)?.name || id;
  $("cats").innerHTML = cats.map(c => `<div class="card"><h3>${esc(c.name)}</h3><p>${esc(c.about)}</p>
    ${c.boards.length ? `<p style="font-size:.85rem">Categories: ${c.boards.map(b => esc(boardName(b))).join(" · ")}</p>` : ""}
    <div class="foot">${c.status === "coming-soon" ? `<span class="tag soon">Notes coming soon</span>`
      : c.languages.map(l => `<a class="btn small primary" href="${Hub.notesUrl(c.id, l)}">${esc(langNames[l] || l)} notes</a>`).join("")}</div></div>`).join("");
})();
</script>
</body>
</html>
