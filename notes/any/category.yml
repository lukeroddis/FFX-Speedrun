# FFX Any%: settings shared by every language of these notes.
# The wording (area names, toggle labels, terms) is in each language's index.md, e.g. en/index.md.

# The Sphere Grid this category uses: sphere-grid/<grid>.json
grid: standard

# The languages these notes are written in, each a folder next to this file.
# A language can be partly translated: missing areas show in English.
languages: [en]

# Route toggles: each one gets a toggle on the run page, and ":::if key=option" picks the notes for one option.
variants:
  blitz: [win, loss]
  spheres: [return4, return2, return0]

# Numbers that depend on the route. "key=option" picks the value for that option.
targets:
  power-bonus:
    blitz=win: 8
    blitz=loss: 9

# The run, in order: one Markdown file per area, with the same file name in every language folder.
areas: [00-introduction, 01-zanarkand, 02-baaj-temple, 03-besaid, 04-ss-liki, 05-kilika, 06-ss-winno, 07-luca, 08-mihen-highroad, 09-mushroom-rock-road, 10-djose, 11-moonflow, 12-guadosalam, 13-thunder-plains, 14-macalania-woods, 15-lake-macalania, 16-bikanel-desert, 17-home, 18-airship, 19-bevelle, 20-via-purifico, 21-highbridge, 22-calm-lands, 23-mt-gagazet, 24-zanarkand, 25-airship-2, 26-inside-sin]
