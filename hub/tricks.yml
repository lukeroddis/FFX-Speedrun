guadosalam-skip:
  name: Guadosalam Skip
  area: Guadosalam
  categories: [any]
  video: https://www.youtube.com/watch?v=nEzX3p7AIQw
  about: Stand outside the Potion Shop and wait to be pushed by the Guado, then run for the exit using the minimap. On the HD Remaster, talk to the woman on the left first so the running Guado pushes you into the door.
