# The Twitch live check (.github/workflows/twitch-live.yml) runs every 10 minutes and lists who's
# streaming FFX speedruns. The result is published to the "live-data" branch as live.json, which the
# Community and Home pages read.

# Twitch categories to look in, by their exact Twitch names (runners use both interchangeably)
games: [Final Fantasy X, Final Fantasy X HD Remaster]

# A stream counts as a speedrun when its title contains one of these (any capitals). A word only counts
# at the start of a word in the title, so "tas" matches "FFX TAS" but not "Fantasy".
# (Twitch's Speedrun tag isn't used: streamers often leave it on when playing casually.)
keywords: [speedrun, any%, nsg, no sphere grid, csr, cutscene remover, race, tas]

# Runners to always show when they're streaming one of the games above, whatever the title says
# (Twitch login names, e.g. [runner1, runner2])
runners: []

# Never listed, even if they match. "exclude" is for Twitch login names (e.g. a banned player);
# "exclude_titles" leaves out streams whose title contains one of these words, which catches
# 24/7 rerun and watch-party channels.
exclude: []
exclude_titles: [24/7, rerun, rebroadcast, watch party, 100%, casual, let's play, playthrough]
