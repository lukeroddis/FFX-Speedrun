# The Tools page. Each entry:
#   name      the tool's name
#   link      where it lives (a page in this repository, or a full web address)
#   about     a sentence or two on what it's for
#   by        who made it (shown as "By …" on the card)
#   by_url    optional: a link for them
#   featured  optional: yes to show it at the top of the page, under "Featured", for the tools new runners
#             need to install. Featured tools show in the order they're listed here.
#   for       optional: the categories that need it, shown as tags, e.g. [Any%, True RNG%]
route-builder:
  name: Sphere Grid Route Builder
  link: tools/route-builder.html
  about: Build a Sphere Grid route: moves, activations, unlocks and teleports for any character, with Sphere Levels and spheres counted. Export it for the notes, or use it for your own challenge runs.
grid-editor:
  name: Sphere Grid Editor
  link: tools/grid-editor.html
  about: For contributors: edit the Sphere Grid data itself, the nodes and links that every grid on the site draws.
map-editor:
  name: Map Editor
  link: tools/map-editor.html
  about: Trace an area map for the notes over a screenshot of the in-game map, with the trails, the route and the chests that matter. Copy the result into the notes.
