# The Skips library. Each entry:
#   name        what the skip is called
#   area        where it happens in the game
#   categories  which categories use it (folder names in notes/)
#   video       a YouTube link
#   about       optional: a sentence or two on what it does and how
#   difficulty  1 (easy) to 5 (hardest), shown as stars
#   by          who made the video (shown as "By …" on the card)
#   by_url      optional: a link for them, e.g. their YouTube or Twitch channel
miihen-skip:
  name: Mi'ihen Skip
  area: Mi'ihen Highroad
  difficulty: 3
  categories: [any]
  video: https://www.youtube.com/watch?v=JEi5zc8o2KI
  about: Speak to the Guy in Blue as you walk into the cutscene, giving you freedom of movement to exit the area.
  by: Madhyama
  by_url: https://www.youtube.com/@madhyama5016
clasko-skip:
  name: Clasko Skip
  area: Mushroom Rock Road
  difficulty: 2
  categories: [any]
  video: https://www.youtube.com/watch?v=iqC-jN8SNd0
  about: Speak to the green Crusader, who pushes you to the cutscene, allowing you to escape to Mushroom Rock Road.
  by: Madhyama
  by_url: https://www.youtube.com/@madhyama5016
