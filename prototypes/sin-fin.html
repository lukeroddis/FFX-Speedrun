<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sin Fin – FFX Notes</title>
<link rel="icon" type="image/png" sizes="32x32" href="../assets/logo/icon-32.png">
<link rel="icon" type="image/png" sizes="192x192" href="../assets/logo/icon-192.png">
<link rel="apple-touch-icon" href="../assets/logo/apple-touch-icon.png">
<link rel="stylesheet" href="../assets/fonts/ubuntu.css">
<style>
  :root {
    --bg-1: #4a4f86;
    --bg-2: #6a6fa8;
    --bg-3: #8c8fc4;
    --panel-hi: #8d8fd0;
    --panel-lo: #2c2c66;
    --panel-edge: #c9cbf0;
    --text: #ffffff;
    --text-dim: #c9cbe8;
    --label: #e8e8ff;
    --gold: #ffd84a;
    --ctb-bar: #9a55d6;
    --ctb-bar-hi: #c58bf2;
    --shadow: 0 2px 0 rgba(0,0,0,.55), 0 0 4px rgba(0,0,0,.35);
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body {
    min-height: 100vh;
    color: var(--text);
    font-family: "Ubuntu", "Segoe UI", sans-serif;
    font-weight: 500;
    letter-spacing: .02em;
    text-shadow: var(--shadow);
    background:
      radial-gradient(ellipse at 15% 20%, rgba(255,255,255,.10), transparent 45%),
      radial-gradient(ellipse at 85% 75%, rgba(20,20,60,.35), transparent 55%),
      repeating-linear-gradient(115deg, rgba(255,255,255,.025) 0 2px, transparent 2px 9px),
      linear-gradient(160deg, var(--bg-3), var(--bg-2) 40%, var(--bg-1));
    background-attachment: fixed;
    padding: 24px 16px 40px;
  }
  .wrap { max-width: 880px; margin: 0 auto; }

  /* ---------- Menu panels (main-menu style) ---------- */
  .label {
    font-size: .8rem; font-weight: 700; letter-spacing: .08em;
    color: var(--label); margin: 0 0 2px 2px;
  }
  .panel {
    position: relative;
    background: linear-gradient(90deg, rgba(30,30,70,.85), rgba(70,70,130,.55) 60%, rgba(70,70,130,.15));
    border-top: 2px solid rgba(255,255,255,.25);
    border-bottom: 2px solid rgba(0,0,0,.35);
    padding: 10px 18px 10px 40px;
    font-size: 1.25rem;
  }
  .help { margin-bottom: 20px; display: flex; flex-wrap: wrap; align-items: baseline; gap: 6px 18px; }
  .help h1 { font-size: 1.5rem; margin: 0; font-weight: 700; }
  .hp { color: #7cf0a8; font-size: 1rem; }
  .hp b { color: var(--text); font-size: 1.2rem; margin-left: 6px; }

  .layout { display: grid; grid-template-columns: 1fr 210px; gap: 22px; align-items: start; }
  @media (max-width: 700px) { .layout { grid-template-columns: 1fr; } .side { order: -1; } }

  /* ---------- CTB list ---------- */
  .ctb {
    background: linear-gradient(180deg, rgba(60,62,110,.9), rgba(40,40,85,.9));
    border: 2px solid #9fa2c8;
    border-radius: 6px;
    box-shadow: inset 0 0 0 2px #2a2a55, 0 4px 14px rgba(0,0,0,.35);
    padding: 10px 10px 10px 0;
  }
  ol { list-style: none; margin: 0; padding: 0; }
  .turn {
    position: relative;
    display: flex; align-items: center; gap: 14px;
    padding: 4px 10px 4px 0;
    cursor: pointer;
    transition: transform .18s ease, opacity .18s ease;
  }
  .turn::before { /* purple CTB bar */
    content: ""; flex: 0 0 auto;
    width: 26px; align-self: stretch; margin: 2px 0;
    background: linear-gradient(90deg, var(--ctb-bar), var(--ctb-bar-hi));
    border-radius: 0 3px 3px 0;
    opacity: .75;
    transition: width .18s ease;
  }
  .turn.past { opacity: .42; }
  .turn.current::before { width: 6px; opacity: 1; }
  .turn.current { transform: translateX(-4px); }
  .turn.current .tile { transform: translateX(-10px) scale(1.06); box-shadow: 0 0 0 2px var(--gold), 0 0 14px rgba(255,216,74,.6); }
  .turn.current .action { background: linear-gradient(90deg, rgba(255,255,255,.22), rgba(255,255,255,.04)); }
  .cursor {
    position: absolute; left: -34px; top: 50%; translate: 0 -50%;
    width: 30px; height: 22px; display: none;
    filter: drop-shadow(0 2px 2px rgba(0,0,0,.5));
  }
  .turn.current .cursor { display: block; animation: bob 1s ease-in-out infinite; }
  @keyframes bob { 50% { transform: translateX(-4px); } }

  /* Portrait tile */
  .tile {
    flex: 0 0 auto; position: relative;
    width: 64px; height: 44px;
    border: 2px solid #e6e6f2;
    outline: 1px solid #222;
    display: grid; place-items: center;
    font-weight: 700; font-size: 1.35rem;
    background: linear-gradient(160deg, color-mix(in srgb, var(--c) 55%, white), var(--c) 55%, color-mix(in srgb, var(--c) 60%, black));
    transition: transform .18s ease, box-shadow .18s ease;
  }
  .tile.mon {
    background: linear-gradient(180deg, #b0182a, #6a0610);
    font-size: 1rem; line-height: .95; text-align: center;
  }
  .tile.mon small { display: block; color: var(--gold); font-size: .95rem; }
  .tile.od::after {
    content: ""; position: absolute; inset: -5px;
    border: 2px solid var(--gold); border-radius: 2px;
    animation: pulse 1.4s ease-in-out infinite;
  }
  @keyframes pulse { 50% { opacity: .25; inset: -2px; } }

  .swap-tiles { flex: 0 0 auto; width: 64px; display: flex; align-items: center; justify-content: space-between; }
  .swap-tiles .tile { width: 26px; height: 26px; font-size: .8rem; border-width: 1px; }
  .swap-tiles span { font-size: .9rem; color: var(--gold); }
  .turn.current .swap-tiles .tile { transform: none; box-shadow: none; }
  .turn.current .swap-tiles { transform: translateX(-10px); }

  .action {
    flex: 1; min-width: 0;
    padding: 8px 12px; border-radius: 3px;
    font-size: 1.05rem; line-height: 1.35;
  }
  .who { font-weight: 700; color: var(--c); text-shadow: 0 0 1px #000, 0 2px 0 rgba(0,0,0,.6); }
  .target { color: var(--text-dim); }
  .od-tag {
    display: inline-block; margin-left: 6px; padding: 0 6px;
    font-size: .72rem; font-weight: 700; letter-spacing: .08em;
    color: #3a2400; text-shadow: none;
    background: linear-gradient(180deg, #fff2a8, var(--gold) 60%, #d49a10);
    border-radius: 3px; vertical-align: 2px;
  }
  .badge {
    display: inline-block; min-width: 26px; margin-left: 4px; padding: 0 5px;
    text-align: center; font-size: .85rem; font-weight: 700;
    background: #1d1d45; border: 1px solid #9fa2c8; border-radius: 10px;
  }

  /* Conditional branch */
  .branch { margin: 10px 0 2px 26px; border-left: 2px dashed rgba(255,216,74,.6); padding-left: 0; }
  .branch-head {
    margin: 0 0 4px; padding: 4px 12px;
    font-size: .9rem; font-style: italic; color: var(--gold);
  }
  .branch .turn::before { width: 12px; }

  /* ---------- Side panel ---------- */
  .side { display: grid; gap: 16px; }
  .box {
    background: linear-gradient(180deg, rgba(60,62,110,.9), rgba(40,40,85,.9));
    border: 2px solid #9fa2c8; border-radius: 6px;
    box-shadow: inset 0 0 0 2px #2a2a55;
    padding: 12px 14px;
  }
  .box h2 { margin: 0 0 10px; font-size: .8rem; letter-spacing: .1em; color: var(--label); }
  .party { display: grid; gap: 6px; }
  .member { display: flex; align-items: center; gap: 10px; font-size: 1rem; }
  .member .tile { width: 34px; height: 26px; font-size: .85rem; border-width: 1px; }
  .counter { font-size: 1.6rem; font-weight: 700; text-align: right; }
  .counter small { font-size: .9rem; color: var(--text-dim); font-weight: 500; }
  .btns { display: flex; gap: 8px; }
  button {
    flex: 1; font: inherit; color: var(--text); text-shadow: var(--shadow);
    padding: 8px 0; cursor: pointer;
    background: linear-gradient(180deg, #7476b8, #3b3c7a);
    border: 1px solid #c9cbf0; border-radius: 3px;
    box-shadow: inset 0 1px 0 rgba(255,255,255,.3);
  }
  button:hover { filter: brightness(1.15); }
  .keys { font-size: .78rem; color: var(--text-dim); margin-top: 8px; line-height: 1.5; }
  kbd { font-family: inherit; padding: 0 5px; border: 1px solid #9fa2c8; border-radius: 3px; background: #1d1d45; }

  .location { margin-top: 26px; }
</style>
</head>
<body>
<div class="wrap">

  <p class="label">HELP</p>
  <header class="panel help">
    <h1>Sin Fin</h1>
    <span class="hp">HP<b>2,000</b></span>
  </header>

  <div class="layout">
    <section class="ctb" aria-label="Turn order">
      <ol id="turns"></ol>
    </section>

    <aside class="side">
      <div class="box">
        <h2>ACTIVE PARTY</h2>
        <div class="party" id="party"></div>
      </div>
      <div class="box">
        <h2>TURN</h2>
        <div class="counter"><span id="num">1</span> <small>/ <span id="total"></span></small></div>
        <div class="btns" style="margin-top:10px">
          <button id="prev" aria-label="Previous turn">▲</button>
          <button id="next" aria-label="Next turn">▼</button>
          <button id="reset" aria-label="Reset">↺</button>
        </div>
        <div class="keys"><kbd>Scroll</kbd> over the page to step — no need to click away from the game.<br><kbd>Space</kbd>/<kbd>↓</kbd> next · <kbd>↑</kbd> back · <kbd>R</kbd> reset · or click a turn</div>
      </div>
    </aside>
  </div>

  <div class="location">
    <p class="label">Location</p>
    <div class="panel">S.S. Liki - Deck</div>
  </div>
</div>

<svg width="0" height="0" style="position:absolute">
  <defs>
    <linearGradient id="cg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/><stop offset="1" stop-color="#b9bcd8"/>
    </linearGradient>
    <symbol id="cursor" viewBox="0 0 30 22">
      <circle cx="8" cy="11" r="7" fill="#f2a516" stroke="#7a4a00" stroke-width="1.2"/>
      <path d="M6 4 L29 11 L6 18 Z" fill="url(#cg)" stroke="#55597a" stroke-width="1.2" stroke-linejoin="round"/>
    </symbol>
  </defs>
</svg>

<script src="../assets/portraits.js"></script>
<script>
/* ---- Data: in the real site this would live in a YAML/JSON file per battle ---- */
const CAST = {
  tidus:   { name: "Tidus",   c: "#3d7bff" },
  yuna:    { name: "Yuna",    c: "#9aa0ad" },
  lulu:    { name: "Lulu",    c: "#c41858" },
  kimahri: { name: "Kimahri", c: "#e8907a" },
  wakka:   { name: "Wakka",   c: "#f39424" },
  valefor: { name: "Valefor", c: "#e07a52", aeon: true },
  enemy:   { name: "Sin Fin", c: "#ff4f97", mon: "A" },
};
const START_PARTY = ["tidus", "yuna", "kimahri"];
const TURNS = [
  { a: "tidus",   act: "Defend" },
  { swap: ["yuna", "lulu"] },
  { a: "lulu",    act: "Thunder", t: "Sin Fin" },
  { swap: ["kimahri", "yuna"] },
  { a: "yuna",    act: "Summon Valefor", summon: "valefor" },
  { a: "valefor", act: "Energy Ray", od: true, t: "Sin Fin" },
  { a: "enemy",   act: [["Move", 2], ["Spines", 2]] },
  { a: "valefor", act: "Thunder", t: "Sin Fin" },
  { a: "enemy",   act: [["Spines"], ["Move"]] },
  { a: "valefor", act: [["Thunder", 2]], t: "Sin Fin" },
  { branch: "If Sin Fin is not dead yet", turns: [
    { a: "enemy", act: "Spines" },
    { swap: ["tidus", "wakka"] },
    { a: "wakka", act: "Attack", t: "Sin Fin" },
  ]},
];

/* ---- Rendering ---- */
const flat = [];
const initials = k => CAST[k].name.slice(0, 2);
function tile(k, extra = "") {
  const ch = CAST[k];
  if (ch.mon) return `<div class="tile mon ${extra}">mon<small>${ch.mon}</small></div>`;
  return `<div class="tile ${extra}" data-who="${portraitSlug(ch.name)}" style="--c:${ch.c}"><span>${initials(k)}</span></div>`;
}
loadPortraits(Object.values(CAST).filter(c => !c.mon).map(c => c.name), "../assets/portraits/");
function actionText(t) {
  const parts = Array.isArray(t.act) ? t.act : [[t.act]];
  return parts.map(([txt, n]) => txt + (n ? `<span class="badge">×${n}</span>` : "")).join(", ");
}
function renderList(turns, ol) {
  for (const t of turns) {
    if (t.branch) {
      const li = document.createElement("li");
      li.className = "branch";
      li.innerHTML = `<p class="branch-head">${t.branch}:</p>`;
      const sub = document.createElement("ol");
      li.appendChild(sub); ol.appendChild(li);
      renderList(t.turns, sub);
      continue;
    }
    const li = document.createElement("li");
    li.className = "turn";
    const cur = `<svg class="cursor"><use href="#cursor"/></svg>`;
    if (t.swap) {
      const [out, inn] = t.swap;
      li.innerHTML = `${cur}<div class="swap-tiles">${tile(out)}<span>➜</span>${tile(inn)}</div>
        <div class="action">Switch <span class="who" style="--c:${CAST[out].c}">${CAST[out].name}</span>
        for <span class="who" style="--c:${CAST[inn].c}">${CAST[inn].name}</span></div>`;
    } else {
      const ch = CAST[t.a];
      li.innerHTML = `${cur}${tile(t.a, t.od ? "od" : "")}
        <div class="action"><span class="who" style="--c:${ch.c}">${ch.name}</span>: ${actionText(t)}
        ${t.od ? '<span class="od-tag">OVERDRIVE</span>' : ""}
        ${t.t ? `<span class="target">→ ${t.t}</span>` : ""}</div>`;
    }
    const idx = flat.length;
    li.addEventListener("click", () => go(idx));
    flat.push({ t, li });
    ol.appendChild(li);
  }
}
renderList(TURNS, document.getElementById("turns"));
document.getElementById("total").textContent = flat.length;

/* Party state as of the current turn */
function partyAt(i) {
  let party = [...START_PARTY], saved = null;
  for (let j = 0; j < i; j++) {
    const t = flat[j].t;
    if (t.summon) { saved = party; party = [t.summon]; }
    if (t.swap) {
      if (saved) { party = saved; saved = null; }
      party = party.map(k => k === t.swap[0] ? t.swap[1] : k);
    }
  }
  return party;
}

let cur = 0;
function go(i) {
  cur = Math.max(0, Math.min(flat.length - 1, i));
  flat.forEach(({ li }, j) => {
    li.classList.toggle("current", j === cur);
    li.classList.toggle("past", j < cur);
  });
  document.getElementById("num").textContent = cur + 1;
  document.getElementById("party").innerHTML = partyAt(cur)
    .map(k => `<div class="member">${tile(k)}<span>${CAST[k].name}</span></div>`).join("");
  flat[cur].li.scrollIntoView({ block: "nearest", behavior: "smooth" });
}
document.getElementById("prev").onclick = () => go(cur - 1);
document.getElementById("next").onclick = () => go(cur + 1);
document.getElementById("reset").onclick = () => go(0);
document.addEventListener("keydown", e => {
  if (e.key === " " || e.key === "ArrowDown") { e.preventDefault(); go(cur + 1); }
  else if (e.key === "ArrowUp") { e.preventDefault(); go(cur - 1); }
  else if (e.key.toLowerCase() === "r") go(0);
});
/* Mouse wheel: one notch = one turn. Works while the game keeps focus,
   because Windows sends wheel events to the window under the cursor. */
let wheelAcc = 0, wheelLock = 0;
document.addEventListener("wheel", e => {
  e.preventDefault();
  const now = performance.now();
  if (now < wheelLock) return;
  const d = e.deltaMode === 1 ? e.deltaY * 40 : e.deltaY;  // lines → px
  if (Math.sign(d) !== Math.sign(wheelAcc)) wheelAcc = 0;  // direction changed
  wheelAcc += d;
  if (Math.abs(wheelAcc) >= 50) {        // one standard notch ≈ 100px
    go(cur + Math.sign(wheelAcc));
    wheelAcc = 0;
    wheelLock = now + 140;               // ignore trackpad/free-spin bursts
  }
}, { passive: false });
go(0);
</script>
</body>
</html>
