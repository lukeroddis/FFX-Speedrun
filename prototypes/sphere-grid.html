<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sphere Grid – FFX Notes</title>
<link rel="icon" type="image/png" sizes="32x32" href="../assets/logo/icon-32.png">
<link rel="icon" type="image/png" sizes="192x192" href="../assets/logo/icon-192.png">
<link rel="apple-touch-icon" href="../assets/logo/apple-touch-icon.png">
<link href="https://fonts.googleapis.com/css2?family=Ubuntu:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../assets/theme.css">
<link rel="stylesheet" href="../assets/tools-light.css">
<script src="../assets/hub.js"></script>
<style>
  :root {
    --bg-1: #4a4f86; --bg-2: #6a6fa8; --bg-3: #8c8fc4;
    --text: #fff; --text-dim: #c9cbe8; --label: #e8e8ff; --gold: #ffd84a;
    --shadow: 0 2px 0 rgba(0,0,0,.55), 0 0 4px rgba(0,0,0,.35);
    --grid-bg: #eceef2; --line: #a3a8b0;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body {
    min-height: 100vh; color: var(--page-text);
    font-family: "Ubuntu", "Segoe UI", sans-serif; font-weight: 500;
    background: var(--bg);
    
    padding: 20px 16px 32px;
  }
  /* the page is the site's own background (light or dark, from theme.css); the menus on it keep the game's look */
  .panel, .box, .frame, aside, header:not(.site-nav), dialog { color: var(--text); text-shadow: var(--shadow); }
  .site-nav { margin: -20px -16px 18px; }
  .wrap { max-width: 1400px; margin: 0 auto; }
  .label { font-size: .8rem; font-weight: 700; letter-spacing: .08em; color: var(--label); margin: 0 0 2px 2px; }
  .panel {
    background: linear-gradient(90deg, var(--head-1), var(--head-2)); border-radius: 6px;
    border-top: 2px solid rgba(255,255,255,.25); border-bottom: 2px solid rgba(0,0,0,.35);
    padding: 10px 18px 10px 40px; margin-bottom: 18px;
  }
  .panel h1 { margin: 0; font-size: 1.5rem; }
  .panel span { color: var(--text-dim); font-size: 1rem; margin-left: 12px; font-weight: 500; }

  .layout { display: grid; grid-template-columns: 1fr 320px; gap: 20px; align-items: start; }
  @media (max-width: 900px) { .layout { grid-template-columns: 1fr; } }

  .frame {
    position: relative; border: 2px solid #9fa2c8; border-radius: 6px; padding: 6px;
    box-shadow: inset 0 0 0 2px #2a2a55, 0 4px 14px rgba(0,0,0,.35);
    background: linear-gradient(180deg, rgba(60,62,110,.9), rgba(40,40,85,.9));
  }
  svg.grid { display: block; width: 100%; height: min(72vh, 820px); min-height: 380px; background: var(--grid-bg); border-radius: 3px; cursor: grab; touch-action: none; }
  svg.grid.dragging { cursor: grabbing; }
  svg text { text-shadow: none; font-family: "Ubuntu", sans-serif; pointer-events: none; }
  .view-btns { position: absolute; right: 14px; top: 14px; display: flex; gap: 4px; }
  .view-btns button { flex: none; padding: 4px 9px; font-size: .8rem; }

  /* greyscale base, colour on top */
  #base { filter: grayscale(1); opacity: .42; }
  #track { filter: grayscale(1); }
  #track .ico { opacity: .42; }
  .edge { fill: none; stroke: var(--line); stroke-linecap: round; }
  .walk { fill: none; stroke-linecap: round; }
  .pop > g { transform-box: fill-box; transform-origin: center; animation: pop .45s ease-out; }
  @keyframes pop { 0% { transform: scale(.4); } 60% { transform: scale(1.25); } 100% { transform: scale(1); } }
  .ring { fill: none; stroke: var(--gold); animation: ring .7s ease-out forwards; }
  @keyframes ring { from { opacity: 1; } to { opacity: 0; r: 40; } }
  .lbl { opacity: .38; }
  .lbl.on { opacity: 1; }
  .tag { transition: transform .26s ease, opacity .25s ease; }
  .tag text { fill: #fff; font-weight: 700; }
  .tele { fill: none; stroke-dasharray: 9 7; animation: march 1s linear infinite; }
  @keyframes march { to { stroke-dashoffset: -32; } }

  /* side panel */
  .side { display: grid; gap: 14px; }
  .box {
    background: linear-gradient(180deg, rgba(60,62,110,.9), rgba(40,40,85,.9));
    border: 2px solid #9fa2c8; border-radius: 6px; box-shadow: inset 0 0 0 2px #2a2a55; padding: 12px 14px;
  }
  .box h2 { margin: 0 0 10px; font-size: .8rem; letter-spacing: .1em; color: var(--label); }
  ol.steps { list-style: none; margin: 0; padding: 0; display: grid; gap: 6px; max-height: 46vh; overflow-y: auto; }
  .step { position: relative; padding: 7px 10px 7px 34px; border-radius: 3px; cursor: pointer; background: rgba(255,255,255,.05); }
  .step .n { position: absolute; left: 8px; top: 8px; width: 20px; height: 20px; border-radius: 50%;
             background: #1d1d45; border: 2px solid var(--c, #9fa2c8); font-size: .72rem; display: grid; place-items: center; }
  .step.past { opacity: .5; }
  .step.current { background: linear-gradient(90deg, rgba(255,255,255,.22), rgba(255,255,255,.04)); box-shadow: inset 3px 0 0 var(--gold); }
  .who { font-weight: 700; color: color-mix(in srgb, var(--c) 65%, white); text-shadow: 0 0 1px #000, 0 1px 0 rgba(0,0,0,.7); }
  .step .t { font-size: .92rem; }
  .step .note { font-size: .78rem; color: var(--text-dim); margin-top: 2px; }
  .chips { margin-top: 4px; display: flex; flex-wrap: wrap; gap: 4px; }
  .chip { font-size: .7rem; font-weight: 700; padding: 1px 7px; border-radius: 9px; text-shadow: none; color: #1b1b2b; }
  .Power { background: #ff8a8a; } .Mana { background: #b99bff; } .Speed { background: #7fe0d0; }
  .Ability { background: #ffe07a; } .Teleport { background: #8fb4ff; } .Warp { background: #d6a0ff; }
  .Fortune { background: #ffd34a; } .Key { background: #c9cbd6; } .Return { background: #9fd0ff; } .Friend { background: #ffb3e0; }
  .step .problem { color: #ffb3b3; }
  .levels { width: 100%; margin-top: 8px; font-size: .82rem; color: var(--text-dim); }
  .btns { display: flex; gap: 6px; margin-top: 10px; }
  button {
    flex: 1; font: inherit; color: var(--text); text-shadow: var(--shadow); padding: 7px 0; cursor: pointer;
    background: linear-gradient(180deg, #7476b8, #3b3c7a); border: 1px solid #c9cbf0; border-radius: 3px;
    box-shadow: inset 0 1px 0 rgba(255,255,255,.3);
  }
  button:hover { filter: brightness(1.15); }
  button.on { background: linear-gradient(180deg, #ffe58a, #d6a516); color: #2a1d00; text-shadow: none; }
  .keys { font-size: .76rem; color: var(--text-dim); margin-top: 8px; line-height: 1.55; }
  kbd { font-family: inherit; padding: 0 5px; border: 1px solid #9fa2c8; border-radius: 3px; background: #1d1d45; }
  .error { padding: 30px; text-align: center; color: #fff; }
</style>
</head>
<body>
<script>Hub.nav("notes");</script>
<div class="wrap">
  <p class="label">HELP</p>
  <header class="panel"><h1>Sphere Grid <span id="routeTitle">Loading…</span></h1></header>

  <div class="layout">
    <div class="frame">
      <svg class="grid" id="grid" aria-label="Sphere Grid">
        <defs>
          <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
            <path d="M0 0 L10 5 L0 10 z" fill="context-stroke"/>
          </marker>
        </defs>
        <g id="base"></g><g id="walk"></g><g id="track"></g><g id="teles"></g><g id="active"></g><g id="here"></g><g id="labels"></g><g id="fx"></g><g id="tags"></g>
      </svg>
      <div class="view-btns">
        <button id="follow" class="on" title="Camera follows each step">Follow</button>
        <button id="whole" title="Show the whole grid">Whole grid</button>
        <button id="zin" aria-label="Zoom in">+</button>
        <button id="zout" aria-label="Zoom out">−</button>
      </div>
    </div>

    <aside class="side">
      <div class="box">
        <h2>ROUTE</h2>
        <ol class="steps" id="steps"></ol>
        <div class="btns">
          <button id="prev" aria-label="Previous step">▲</button>
          <button id="next" aria-label="Next step">▼</button>
          <button id="play" aria-label="Play all">▶</button>
          <button id="reset" aria-label="Reset">↺</button>
        </div>
        <div class="keys"><kbd>Scroll</kbd> over the page to step, no need to click away from the game.<br>
          <kbd>Ctrl</kbd>+<kbd>Scroll</kbd> or +/− zoom · drag the grid to pan<br>
          <kbd>Space</kbd>/<kbd>↓</kbd> next · <kbd>↑</kbd> back · <kbd>P</kbd> play · <kbd>R</kbd> reset</div>
      </div>
      <div class="box">
        <h2>USED SO FAR</h2>
        <div class="chips" id="totals"></div>
      </div>
    </aside>
  </div>
</div>

<script src="../assets/grid-icons.js"></script>
<script src="../assets/grid-layout.js"></script>
<script src="../assets/route-engine.js"></script>
<script src="../assets/notes-config.js"></script>
<script>
(async () => {
const $ = id => document.getElementById(id);
const NS = "http://www.w3.org/2000/svg";
const TYPES = window.GRID_TYPES, CHARS = window.GRID_CHARACTERS, L = window.GridLayout;
const esc = s => String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));

/* ================= LOAD ================= */
/* ?route=<name> plays a route from notes/<category>/sphere-grid/. Without it, the page plays prototypes/demo.json,
   an example kept here for experimenting with the player on its own. */
const routeName = new URLSearchParams(location.search).get("route") || "";
let grid, route, ENGINE, START;
/* ?cat=any&route=besaid-tidus: routes live in notes/<category>/sphere-grid/, and the category says which grid it uses */
const { cat } = NotesConfig.params();
const catRoutes = NotesConfig.routeLoader(cat);
const loadRoute = name => name ? catRoutes(name) : NotesConfig.fetchJson("demo.json");
try {
  grid = await NotesConfig.loadGrid(await NotesConfig.loadCategory(cat));
  ENGINE = RouteEngine.create(grid);
  ({ route, start: START } = await RouteEngine.resolve(ENGINE, routeName, loadRoute));   // "after" routes are played first
} catch {
  $("routeTitle").textContent = "";
  document.querySelector(".layout").innerHTML = `<div class="box error">Couldn't load the grid or route “${esc(routeName || "demo.json")}”.<br>Open this page through a local server (see DEVELOPER_GUIDE.md).</div>`;
  return;
}
$("routeTitle").textContent = route.title + (route.note ? ` · ${route.note}` : "");

const R = grid.meta.nodeRadius;
const N = new Map(grid.nodes.map(n => [n.id, n]));
const adj = new Map();
const ek = (a, b) => a < b ? a + "|" + b : b + "|" + a;
const edgeByKey = new Map();
for (const e of grid.edges) {
  (adj.get(e.a) || adj.set(e.a, []).get(e.a)).push(e.b);
  (adj.get(e.b) || adj.set(e.b, []).get(e.b)).push(e.a);
  edgeByKey.set(ek(e.a, e.b), e);
}
const nodeName = id => { const n = N.get(id); return n.name || (n.value ? `${n.value} ${TYPES[n.type].label}` : TYPES[n.type].label); };
const charName = c => CHARS[c]?.name || c;
const charColor = c => CHARS[c]?.color || "#888";

/* ================= PLAY THE ROUTE (assets/route-engine.js) ================= */
/* FRAMES[i]: the state after step i (0 = the start); SUBS[i]: the in-between states to animate; FOCUS[i]: nodes to frame */
const RESULT = ENGINE.run(route, START);
const starts = ENGINE.starts;   // every character gets a nameplate
const routeChars = [...new Set(route.steps.map(st => st.character))];
const FRAMES = [RESULT.start], SUBS = [[]], FOCUS = [routeChars.map(c => RESULT.start.pos[c]).filter(Boolean)];
if (!FOCUS[0].length) FOCUS[0] = Object.values(RESULT.start.pos);
for (const st of RESULT.steps) { FRAMES.push(st.subs.at(-1)?.state || FRAMES.at(-1)); SUBS.push(st.subs); FOCUS.push(st.focus); }
if (RESULT.problems.length) console.warn(RESULT.problems.join("\n"));

/* ================= DRAW THE STATIC GRID ================= */
const el = (tag, attrs, parent) => { const e = document.createElementNS(NS, tag); for (const k in attrs) e.setAttribute(k, attrs[k]); parent?.appendChild(e); return e; };
const svg = $("grid");
{
  const out = [];
  for (const e of grid.edges) out.push(`<path class="edge" d="${L.edgePath(N.get(e.a), N.get(e.b), e.bend)}" stroke-width="${R * 0.45}"/>`);
  for (const n of grid.nodes) out.push(`<g transform="translate(${n.x} ${n.y}) scale(${L.nodeRadius(n, R)})">${gridIcon(n.type)}</g>`);
  $("base").innerHTML = out.join("");
}
const labelEls = new Map();   // node id → [label elements]
/* Only nodes this route activates or teleports to get labels, so the grey grid stays clean.
   They show faintly up front (what's coming) and light up once activated. */
const routeNodes = new Set(RESULT.steps.flatMap(st => st.targets));
{
  const out = [];
  for (const n of grid.nodes) {
    if (!routeNodes.has(n.id)) continue;
    const t = TYPES[n.type];
    if (n.value) {
      const b = L.labelBox(n, "value", R);
      out.push(`<text class="lbl" data-n="${n.id}" x="${b.cx}" y="${b.cy}" dominant-baseline="central" text-anchor="middle" font-size="${R * 0.75}" font-weight="700" fill="${t.ink || "#333"}" stroke="#fff" stroke-width="${R * 0.2}" paint-order="stroke">${esc(n.value)}</text>`);
    }
    if (n.name) {
      const b = L.labelBox(n, "name", R);
      out.push(`<g class="lbl" data-n="${n.id}">`);
      if (Math.hypot(b.cx - n.x, b.cy - n.y) > L.nodeRadius(n, R) + b.h * 1.1)
        out.push(`<line x1="${n.x}" y1="${n.y}" x2="${b.cx}" y2="${b.cy}" stroke="#8a3fd1" stroke-width="${R * 0.1}"/>`);
      out.push(`<rect x="${b.cx - b.w / 2}" y="${b.cy - b.h / 2}" width="${b.w}" height="${b.h}" rx="${R * 0.3}" fill="#8a3fd1" stroke="#fff" stroke-width="${R * 0.08}"/>`);
      out.push(`<text x="${b.cx}" y="${b.cy}" dominant-baseline="central" text-anchor="middle" font-size="${R * 0.85}" fill="#fff">${esc(n.name)}</text></g>`);
    }
  }
  $("labels").innerHTML = out.join("");
  for (const e of $("labels").children) { const id = e.dataset.n; (labelEls.get(id) || labelEls.set(id, []).get(id)).push(e); }
}

/* character nameplates */
const tags = {};
for (const ch in starts) {
  const g = el("g", { class: "tag" }, $("tags")), name = charName(ch), w = name.length * R * 0.62 + R;
  el("rect", { x: -w / 2, y: 0, width: w, height: R * 1.45, rx: R * 0.2, fill: charColor(ch), stroke: "#fff", "stroke-width": R * 0.1 }, g);
  el("text", { y: R * 0.75, "text-anchor": "middle", "dominant-baseline": "central", "font-size": R * 0.95 }, g).textContent = name;
  tags[ch] = g;
}
function placeTag(ch, id, stack = 0) {   // stack: how many other tags already sit on this node
  const own = stack === 0 && N.get(id).start === ch && N.get(id).startAt;
  const n = N.get(id), [dx, dy] = own ? n.startAt : [0, L.nodeRadius(n, R) + R * 1.55];
  const oy = (own ? -R * 0.72 : 0) + stack * R * 1.65;   // startAt is the tag's centre
  tags[ch].style.transform = `translate(${n.x + dx}px, ${n.y + dy + oy}px)`;
}

/* ================= RENDER A STATE ================= */
let shownAct = new Set();
function render(s, action, node, ch) {
  // walked links, in the colour of whoever walked them first
  $("walk").innerHTML = [...s.walk].map(([k, c]) => {
    const e = edgeByKey.get(k); if (!e) return "";
    return `<path class="walk" d="${L.edgePath(N.get(e.a), N.get(e.b), e.bend)}" stroke="${charColor(c)}" stroke-width="${R * 0.55}"/>`;
  }).join("");
  // nodes the coloured track passes through (but not activated) are redrawn on top of it, still greyed out
  const onTrack = new Set();
  for (const k of s.walk.keys()) for (const id of k.split("|")) if (!s.act.has(id) && !s.unlocked.has(id)) onTrack.add(id);
  $("track").innerHTML = [...onTrack].map(id => {
    const n = N.get(id);   // solid backing disc hides the track; the faded icon matches the rest of the grey grid
    return `<g transform="translate(${n.x} ${n.y}) scale(${L.nodeRadius(n, R)})"><circle r="1" fill="var(--grid-bg)"/><g class="ico">${gridIcon(n.type)}</g></g>`;
  }).join("") + [...s.unlocked].map(id => {
    const n = N.get(id);   // an unlocked lock becomes an empty node
    return `<g class="${id === node && action === "unlock" ? "pop" : ""}" transform="translate(${n.x} ${n.y})"><circle r="${R * 1.04}" fill="var(--grid-bg)"/>
      <g><g class="ico" transform="scale(${R * 0.65})">${gridIcon("empty")}</g></g></g>`;
  }).join("");
  // activated nodes in full colour
  $("active").innerHTML = [...s.act].map(([id]) => {
    const n = N.get(id);
    return `<g class="${id === node && action === "activate" ? "pop" : ""}" transform="translate(${n.x} ${n.y})"><g>
      <g transform="scale(${L.nodeRadius(n, R)})">${gridIcon(n.type)}</g></g></g>`;
  }).join("");
  // a ring in each character's colour marks where they stand (rings nest when characters share a node)
  const ringCount = {};
  $("here").innerHTML = Object.keys(tags).map(c => {
    const id = s.pos[c], n = N.get(id), k = ringCount[id] = (ringCount[id] ?? -1) + 1;
    return `<circle cx="${n.x}" cy="${n.y}" r="${L.nodeRadius(n, R) + R * (0.32 + k * 0.3)}" fill="none" stroke="${charColor(c)}" stroke-width="${R * 0.24}"/>`;
  }).join("");
  // labels light up for activated nodes
  const now = new Set(s.act.keys());
  for (const id of new Set([...now, ...shownAct])) for (const e of labelEls.get(id) || []) e.classList.toggle("on", now.has(id));
  shownAct = now;
  // teleport arcs
  $("teles").innerHTML = s.teles.map(t => {
    const A = N.get(t.from), B = N.get(t.to), dx = B.x - A.x, dy = B.y - A.y, len = Math.hypot(dx, dy) || 1;
    const cx = (A.x + B.x) / 2 - dy / len * len * 0.28, cy = (A.y + B.y) / 2 + dx / len * len * 0.28;
    const mx = (A.x + 2 * cx + B.x) / 4, my = (A.y + 2 * cy + B.y) / 4;
    return `<path class="tele" d="M${A.x} ${A.y}Q${cx} ${cy} ${B.x} ${B.y}" stroke="${charColor(t.ch)}" stroke-width="${R * 0.28}" marker-end="url(#arrow)"/>
      <text x="${mx}" y="${my - R * 0.6}" text-anchor="middle" font-size="${R * 0.95}" font-weight="700" fill="${charColor(t.ch)}" stroke="#fff" stroke-width="${R * 0.25}" paint-order="stroke">${esc(t.sphere || "Teleport")}</text>`;
  }).join("");
  // nameplates (characters sharing a node stack downwards)
  const onNode = {};
  for (const c in tags) {
    const stack = onNode[s.pos[c]] = (onNode[s.pos[c]] ?? -1) + 1;
    if (action === "teleport" && c === ch) {
      tags[c].style.opacity = 0;
      setTimeout(() => { tags[c].style.transition = "none"; placeTag(c, s.pos[c], stack); tags[c].getBoundingClientRect(); tags[c].style.transition = ""; tags[c].style.opacity = 1; }, 280);
    } else { tags[c].style.opacity = 1; placeTag(c, s.pos[c], stack); }
  }
  if (action === "activate" || action === "unlock") {
    const n = N.get(node), ring = el("circle", { class: "ring", cx: n.x, cy: n.y, r: R, "stroke-width": R * 0.3 }, $("fx"));
    setTimeout(() => ring.remove(), 750);
  }
}

/* ================= CAMERA ================= */
const xs = grid.nodes.map(n => n.x), ys = grid.nodes.map(n => n.y), pad = R * 4;
const WHOLE = { x: Math.min(...xs) - pad, y: Math.min(...ys) - pad, w: Math.max(...xs) - Math.min(...xs) + 2 * pad, h: Math.max(...ys) - Math.min(...ys) + 2 * pad };
let vb = { ...WHOLE }, anim = 0, follow = true;
const applyVB = () => svg.setAttribute("viewBox", `${vb.x} ${vb.y} ${vb.w} ${vb.h}`);
function fitBox(ids) {
  const ps = ids.map(id => N.get(id));
  let x0 = Math.min(...ps.map(p => p.x)), x1 = Math.max(...ps.map(p => p.x)), y0 = Math.min(...ps.map(p => p.y)), y1 = Math.max(...ps.map(p => p.y));
  const minW = R * 30, aspect = svg.clientWidth / svg.clientHeight || 1.5;
  let w = Math.max(x1 - x0 + R * 10, minW), h = Math.max(y1 - y0 + R * 10, minW / aspect);
  if (w / h < aspect) w = h * aspect; else h = w / aspect;
  return { x: (x0 + x1) / 2 - w / 2, y: (y0 + y1) / 2 - h / 2, w, h };
}
function flyTo(target, ms = 650) {
  const from = { ...vb }, t0 = performance.now(), my = ++anim;
  const ease = t => t < 0.5 ? 2 * t * t : 1 - (-2 * t + 2) ** 2 / 2;
  const tick = now => {
    if (my !== anim) return;
    const t = Math.min(1, (now - t0) / ms), k = ease(t);
    for (const p of ["x", "y", "w", "h"]) vb[p] = from[p] + (target[p] - from[p]) * k;
    applyVB(); if (t < 1) requestAnimationFrame(tick);
  };
  requestAnimationFrame(tick);
}
function setFollow(on) { follow = on; $("follow").classList.toggle("on", on); }
$("follow").onclick = () => { setFollow(!follow); if (follow) flyTo(fitBox(FOCUS[cur])); };
$("whole").onclick = () => { setFollow(false); flyTo(WHOLE); };
function zoomAt(f, cx = vb.x + vb.w / 2, cy = vb.y + vb.h / 2) {
  anim++; setFollow(false);
  const w = Math.min(WHOLE.w * 1.6, Math.max(R * 12, vb.w * f)), k = w / vb.w;
  vb = { x: cx - (cx - vb.x) * k, y: cy - (cy - vb.y) * k, w, h: vb.h * k }; applyVB();
}
$("zin").onclick = () => zoomAt(0.7);
$("zout").onclick = () => zoomAt(1 / 0.7);
const toWorld = e => { const p = svg.createSVGPoint(); p.x = e.clientX; p.y = e.clientY; return p.matrixTransform(svg.getScreenCTM().inverse()); };
let drag = null;
svg.addEventListener("pointerdown", e => { drag = { x: e.clientX, y: e.clientY, vb: { ...vb }, moved: false }; svg.setPointerCapture(e.pointerId); });
svg.addEventListener("pointermove", e => {
  if (!drag) return;
  const dx = e.clientX - drag.x, dy = e.clientY - drag.y;
  if (!drag.moved && Math.hypot(dx, dy) < 4) return;
  if (!drag.moved) { drag.moved = true; anim++; setFollow(false); svg.classList.add("dragging"); }
  const s = vb.w / svg.clientWidth;
  vb.x = drag.vb.x - dx * s; vb.y = drag.vb.y - dy * s; applyVB();
});
svg.addEventListener("pointerup", () => { drag = null; svg.classList.remove("dragging"); });

/* ================= STEPS PANEL ================= */
const stepEls = [];
{
  const li = document.createElement("li");
  const from = route.after ? `Continues from “${route.after}”` : "Everyone on their starting node";
  const placed = Object.entries(route.start || {}).map(([c, id]) => `${charName(c)} on ${nodeName(id)}`).join(", ");
  li.className = "step"; li.innerHTML = `<span class="n">0</span><div class="t">Start</div><div class="note">${esc([from, placed].filter(Boolean).join(" · "))}</div>`;
  $("steps").appendChild(li); stepEls.push(li);
}
const listNames = ids => (Array.isArray(ids) ? ids : [ids]).map(id => esc(nodeName(id))).join(", ");
RESULT.steps.forEach((info, i) => {
  const st = info.step, li = document.createElement("li");
  li.className = "step"; li.style.setProperty("--c", charColor(st.character));
  const tp = st.teleport && typeof st.teleport === "object" ? st.teleport : st.teleport ? { sphere: "Teleport", to: st.teleport } : st.warp ? { sphere: "Warp", to: st.warp } : null;
  const parts = [
    tp && `${esc(tp.sphere)} → ${esc(nodeName(tp.to))}`,
    st.move && `move to ${esc(nodeName(Array.isArray(st.move) ? st.move.at(-1) : st.move))}`,
    st.unlock && `unlock ${listNames(st.unlock)}`,
    st.activate?.length && `activate ${listNames(st.activate)}`,
  ].filter(Boolean);
  const what = parts.join(", ").replace(/^./, c => c.toUpperCase());
  const note = [st.note, info.moves ? `${info.moves} move${info.moves > 1 ? "s" : ""}` : "", info.levels ? `${info.levels} S.Lvl` : "",
    info.saves ? `skips ${info.saves} moves` : ""].filter(Boolean).map(esc).join(" · ");
  li.innerHTML = `<span class="n">${i + 1}</span><div class="t"><span class="who">${esc(charName(st.character))}</span>: ${what}</div>
    ${note ? `<div class="note">${note}</div>` : ""}
    ${info.problems.map(m => `<div class="note problem">⚠ ${esc(m)}</div>`).join("")}
    <div class="chips">${Object.entries(info.spheres).map(([k, v]) => `<span class="chip ${esc(k)}">${v}× ${esc(k)}</span>`).join("")}</div>`;
  $("steps").appendChild(li); stepEls.push(li);
});
stepEls.forEach((li, i) => li.addEventListener("click", () => go(i, true)));
function totals(i) {
  const t = ENGINE.totals({ steps: RESULT.steps.slice(0, i) });
  const lv = Object.entries(t.levels).filter(([, v]) => v);
  $("totals").innerHTML = (Object.keys(t.spheres).length
    ? Object.entries(t.spheres).map(([k, v]) => `<span class="chip ${esc(k)}">${v}× ${esc(k)}</span>`).join("")
    : `<span style="color:var(--text-dim);font-size:.85rem">None yet</span>`)
    + (lv.length ? `<div class="levels">Sphere Levels: ${lv.map(([c, v]) => `<span class="who" style="--c:${charColor(c)}">${esc(charName(c))}</span> ${v}`).join(" · ")}</div>` : "");
}

/* ================= STEPPING ================= */
const sleep = ms => new Promise(r => setTimeout(r, ms));
let cur = 0, token = 0, playing = false;
async function go(i, user) {
  if (user) playing = false;
  i = Math.max(0, Math.min(FRAMES.length - 1, i));
  const my = ++token, animate = i === cur + 1;
  cur = i;
  stepEls.forEach((li, j) => { li.classList.toggle("current", j === i); li.classList.toggle("past", j < i); });
  stepEls[i].scrollIntoView({ block: "nearest", behavior: "smooth" });
  totals(i);
  if (follow) flyTo(fitBox(FOCUS[i]), SUBS[i].some(s => s.action === "teleport") ? 900 : 650);
  if (!animate) { render(FRAMES[i]); return; }
  for (const sub of SUBS[i]) {
    if (my !== token) return;
    render(sub.state, sub.action, sub.node, sub.ch);
    await sleep(sub.action === "teleport" ? 900 : sub.action === "activate" ? 420 : 300);
  }
}
async function playAll() {
  playing = true; await go(0);
  while (playing && cur < FRAMES.length - 1) { await go(cur + 1); await sleep(450); }
  playing = false;
}
$("prev").onclick = () => go(cur - 1, true);
$("next").onclick = () => go(cur + 1, true);
$("reset").onclick = () => go(0, true);
$("play").onclick = playAll;
document.addEventListener("keydown", e => {
  if (e.key === " " || e.key === "ArrowDown") { e.preventDefault(); go(cur + 1, true); }
  else if (e.key === "ArrowUp") { e.preventDefault(); go(cur - 1, true); }
  else if (e.key.toLowerCase() === "r") go(0, true);
  else if (e.key.toLowerCase() === "p") playAll();
});
/* Scroll steps the route (works while the game keeps focus); Ctrl+scroll zooms */
let wheelAcc = 0, wheelLock = 0;
document.addEventListener("wheel", e => {
  e.preventDefault();
  if (e.ctrlKey) { if (svg.contains(e.target)) { const p = toWorld(e); zoomAt(Math.exp(e.deltaY * 0.002), p.x, p.y); } return; }
  const now = performance.now(); if (now < wheelLock) return;
  const d = e.deltaMode === 1 ? e.deltaY * 40 : e.deltaY;
  if (Math.sign(d) !== Math.sign(wheelAcc)) wheelAcc = 0;
  wheelAcc += d;
  if (Math.abs(wheelAcc) >= 50) { go(cur + Math.sign(wheelAcc), true); wheelAcc = 0; wheelLock = now + 140; }
}, { passive: false });

applyVB();
render(FRAMES[0]);
go(0);
})();
</script>
