<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sphere Grid – FFX Notes</title>
<link href="https://fonts.googleapis.com/css2?family=Ubuntu:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg-1: #4a4f86; --bg-2: #6a6fa8; --bg-3: #8c8fc4;
    --text: #fff; --text-dim: #c9cbe8; --label: #e8e8ff; --gold: #ffd84a;
    --shadow: 0 2px 0 rgba(0,0,0,.55), 0 0 4px rgba(0,0,0,.35);
    --tidus: #2f74ff; --wakka: #f39424;
    --grid-bg: #eceef2; --node: #d6d9df; --node-edge: #7d838c; --line: #a3a8b0; --ink: #4a4f58;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body {
    min-height: 100vh; color: var(--text);
    font-family: "Ubuntu", "Segoe UI", sans-serif; font-weight: 500;
    text-shadow: var(--shadow);
    background:
      radial-gradient(ellipse at 15% 20%, rgba(255,255,255,.10), transparent 45%),
      repeating-linear-gradient(115deg, rgba(255,255,255,.025) 0 2px, transparent 2px 9px),
      linear-gradient(160deg, var(--bg-3), var(--bg-2) 40%, var(--bg-1));
    background-attachment: fixed;
    padding: 24px 16px 40px;
  }
  .wrap { max-width: 1180px; margin: 0 auto; }
  .label { font-size: .8rem; font-weight: 700; letter-spacing: .08em; color: var(--label); margin: 0 0 2px 2px; }
  .panel {
    background: linear-gradient(90deg, rgba(30,30,70,.85), rgba(70,70,130,.55) 60%, rgba(70,70,130,.15));
    border-top: 2px solid rgba(255,255,255,.25); border-bottom: 2px solid rgba(0,0,0,.35);
    padding: 10px 18px 10px 40px; font-size: 1.25rem; margin-bottom: 20px;
  }
  .panel h1 { margin: 0; font-size: 1.5rem; }
  .panel span { color: var(--text-dim); font-size: 1rem; margin-left: 12px; }

  .layout { display: grid; grid-template-columns: 1fr 300px; gap: 22px; align-items: start; }
  @media (max-width: 820px) { .layout { grid-template-columns: 1fr; } }

  .frame {
    border: 2px solid #9fa2c8; border-radius: 6px;
    box-shadow: inset 0 0 0 2px #2a2a55, 0 4px 14px rgba(0,0,0,.35);
    padding: 6px; background: linear-gradient(180deg, rgba(60,62,110,.9), rgba(40,40,85,.9));
  }
  svg.grid { display: block; width: 100%; height: auto; background: var(--grid-bg); border-radius: 3px; }
  svg text { text-shadow: none; font-family: "Ubuntu", sans-serif; }

  /* Grid: greyscale base */
  .edge { stroke: var(--line); stroke-width: 7; stroke-linecap: round; transition: stroke .3s; }
  .edge.walk-tidus { stroke: var(--tidus); }
  .edge.walk-wakka { stroke: var(--wakka); }
  .node .body { fill: var(--node); stroke: var(--node-edge); stroke-width: 2.5; transition: fill .3s, stroke .3s; }
  .node .inner { fill: none; stroke: var(--node-edge); stroke-width: 2; transition: stroke .3s; }
  .node .lock { fill: #6b7079; stroke: #3d4148; stroke-width: 2.5; }
  .node .lockt { fill: #fff; font-size: 15px; font-weight: 700; }
  .node .val { fill: var(--ink); font-size: 14px; font-weight: 700; }
  .node .name { fill: var(--ink); font-size: 15px; font-weight: 500; }
  .node.on-tidus .body { fill: var(--tidus); stroke: #fff; }
  .node.on-wakka .body { fill: var(--wakka); stroke: #fff; }
  .node.on-tidus .inner, .node.on-wakka .inner { stroke: #fff; }
  .node.on-tidus .name { fill: var(--tidus); font-weight: 700; }
  .ring { fill: none; stroke: var(--gold); stroke-width: 4; animation: ring .7s ease-out forwards; }
  @keyframes ring { from { r: 14; opacity: 1; } to { r: 46; opacity: 0; } }

  /* Character tags */
  .tag { transition: transform .28s ease, opacity .25s ease; }
  .tag rect { stroke: #fff; stroke-width: 2; }
  .tag text { fill: #fff; font-size: 15px; font-weight: 700; }

  /* Teleports */
  .tele { fill: none; stroke: var(--tidus); stroke-width: 3; stroke-dasharray: 9 7;
          animation: march 1s linear infinite; opacity: .85; }
  .tele.new { animation: march 1s linear infinite, fadein .5s ease-out; }
  .tele-label { fill: var(--tidus); font-size: 13px; font-weight: 700; }
  @keyframes march { to { stroke-dashoffset: -32; } }
  @keyframes fadein { from { opacity: 0; } }

  /* Steps panel */
  .side { display: grid; gap: 16px; }
  .box {
    background: linear-gradient(180deg, rgba(60,62,110,.9), rgba(40,40,85,.9));
    border: 2px solid #9fa2c8; border-radius: 6px; box-shadow: inset 0 0 0 2px #2a2a55;
    padding: 12px 14px;
  }
  .box h2 { margin: 0 0 10px; font-size: .8rem; letter-spacing: .1em; color: var(--label); }
  ol.steps { list-style: none; margin: 0; padding: 0; display: grid; gap: 6px; }
  .step {
    position: relative; padding: 8px 10px 8px 34px; border-radius: 3px; cursor: pointer;
    background: rgba(255,255,255,.05); transition: opacity .2s, background .2s;
  }
  .step .n { position: absolute; left: 8px; top: 8px; width: 20px; height: 20px; border-radius: 50%;
             background: #1d1d45; border: 1px solid #9fa2c8; font-size: .75rem; display: grid; place-items: center; }
  .step.past { opacity: .5; }
  .step.current { background: linear-gradient(90deg, rgba(255,255,255,.22), rgba(255,255,255,.04));
                  box-shadow: inset 3px 0 0 var(--gold); }
  .step.tp .n { background: var(--tidus); }
  .step .t { font-size: .95rem; }
  .step .note { font-size: .8rem; color: var(--text-dim); margin-top: 3px; }
  .chips { margin-top: 5px; display: flex; flex-wrap: wrap; gap: 4px; }
  .chip { font-size: .72rem; font-weight: 700; padding: 1px 7px; border-radius: 9px; text-shadow: none; color: #1b1b2b; }
  .Power { background: #ff8a8a; } .Mana { background: #b99bff; } .Speed { background: #7fe0d0; }
  .Ability { background: #ffe07a; } .Teleport { background: #8fb4ff; } .Warp { background: #d6a0ff; }
  .totals { display: flex; flex-wrap: wrap; gap: 6px; }
  .btns { display: flex; gap: 8px; margin-top: 10px; }
  button {
    flex: 1; font: inherit; color: var(--text); text-shadow: var(--shadow); padding: 8px 0; cursor: pointer;
    background: linear-gradient(180deg, #7476b8, #3b3c7a); border: 1px solid #c9cbf0; border-radius: 3px;
    box-shadow: inset 0 1px 0 rgba(255,255,255,.3);
  }
  button:hover { filter: brightness(1.15); }
  .keys { font-size: .78rem; color: var(--text-dim); margin-top: 8px; line-height: 1.5; }
  kbd { font-family: inherit; padding: 0 5px; border: 1px solid #9fa2c8; border-radius: 3px; background: #1d1d45; }
</style>
</head>
<body>
<div class="wrap">
  <p class="label">HELP</p>
  <header class="panel"><h1>Sphere Grid <span>Tidus · prototype section</span></h1></header>

  <div class="layout">
    <div class="frame">
      <svg class="grid" id="grid" viewBox="50 10 820 475" aria-label="Sphere Grid section">
        <defs>
          <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
            <path d="M0 0 L10 5 L0 10 z" fill="var(--tidus)"/>
          </marker>
        </defs>
        <g id="edges"></g><g id="teles"></g><g id="nodes"></g><g id="fx"></g><g id="tags"></g>
      </svg>
    </div>

    <aside class="side">
      <div class="box">
        <h2>ROUTE</h2>
        <ol class="steps" id="steps"></ol>
        <div class="btns">
          <button id="prev" aria-label="Previous step">▲</button>
          <button id="next" aria-label="Next step">▼</button>
          <button id="play" aria-label="Play all">▶</button>
          <button id="reset" aria-label="Reset">↺</button>
        </div>
        <div class="keys"><kbd>Scroll</kbd> over the page to step, no need to click away from the game.<br>
          <kbd>Space</kbd>/<kbd>↓</kbd> next · <kbd>↑</kbd> back · <kbd>P</kbd> play · <kbd>R</kbd> reset</div>
      </div>
      <div class="box">
        <h2>SPHERES USED SO FAR</h2>
        <div class="totals" id="totals"></div>
      </div>
    </aside>
  </div>
</div>

<script>
/* ================= DATA =================
   In the real site: grid.json (written once, ideally by a tracing tool)
   and one small YAML/JSON route file per character section.            */

const NODES = {
  ts:    { x: 120, y: 400, t: "stat", v: "+1",   s: "Agl" },
  n1:    { x: 120, y: 290, t: "stat", v: "+1",   s: "Str" },
  flee:  { x: 120, y: 170, t: "ability", name: "Flee" },
  n2:    { x: 240, y: 170, t: "stat", v: "+1",   s: "Agl" },
  cheer: { x: 360, y: 170, t: "ability", name: "Cheer" },
  n3:    { x: 360, y: 290, t: "stat", v: "+200", s: "HP" },
  n4:    { x: 240, y: 400, t: "empty" },
  l1:    { x: 360, y: 400, t: "lock", name: "L1" },
  n5:    { x: 480, y: 290, t: "stat", v: "+1",   s: "Str" },
  n6:    { x: 580, y: 290, t: "empty" },
  w1:    { x: 680, y: 290, t: "stat", v: "+20",  s: "MP" },
  w2:    { x: 680, y: 170, t: "stat", v: "+1",   s: "Str" },
  haste: { x: 800, y: 170, t: "ability", name: "Haste" },
  xs:    { x: 800, y: 60,  t: "ability", name: "Extract Speed" },
  w3:    { x: 680, y: 400, t: "stat", v: "+1",   s: "Def" },
  l2:    { x: 800, y: 400, t: "lock", name: "L2" },
};
const EDGES = [
  ["ts","n1"],["n1","flee"],["flee","n2"],["n2","cheer"],["cheer","n3"],["n3","l1"],
  ["ts","n4"],["n4","l1"],["n3","n5"],["n5","n6"],["n6","w1"],["w1","w2"],
  ["w2","haste"],["haste","xs"],["w1","w3"],["w3","l2"],
];

/* Other characters' progress at this point in the run */
const OTHERS = { wakka: { name: "Wakka", nodes: ["w1","w2","w3"], at: "w3" } };

const ROUTE = {
  character: "tidus", name: "Tidus", start: "ts",
  steps: [
    { activate: ["n1", "flee"],  spheres: { Power: 1, Ability: 1 }, note: "After Kimahri" },
    { activate: ["n2", "cheer"], spheres: { Speed: 1, Ability: 1 } },
    { teleport: "w2",            spheres: { Teleport: 1 }, note: "Lands on a node Wakka activated" },
    { activate: ["haste"],       spheres: { Ability: 1 } },
  ],
};

/* ================= LOGIC ================= */
const COLORS = { tidus: "var(--tidus)", wakka: "var(--wakka)" };
const adj = {};
for (const [a, b] of EDGES) { (adj[a] ??= []).push(b); (adj[b] ??= []).push(a); }
const ek = (a, b) => a < b ? a + "|" + b : b + "|" + a;
const nodeName = id => { const n = NODES[id]; return n.name ?? `${n.v} ${n.s}`; };

function path(from, to, state) {           // BFS; locks block unless activated
  const prev = { [from]: null }, q = [from];
  while (q.length) {
    const c = q.shift();
    if (c === to) break;
    for (const nb of adj[c] || []) {
      if (nb in prev) continue;
      if (NODES[nb].t === "lock" && nb !== to && !state.act.has(nb)) continue;
      prev[nb] = c; q.push(nb);
    }
  }
  const out = []; for (let c = to; c && c !== from; c = prev[c]) out.unshift(c);
  return out;
}
const clone = s => ({ pos: s.pos, act: new Set(s.act), walk: new Set(s.walk), teles: [...s.teles] });

/* Expand each route step into animation sub-frames */
const FRAMES = [{ pos: ROUTE.start, act: new Set(), walk: new Set(), teles: [] }];
const SUBS = [[]];
for (const step of ROUTE.steps) {
  let s = clone(FRAMES.at(-1)); const subs = [];
  if (step.teleport) {
    step.saves = path(s.pos, step.teleport, s).length;
    s = clone(s); s.teles.push([s.pos, step.teleport]); s.pos = step.teleport;
    subs.push({ state: s, action: "teleport" });
  }
  for (const target of step.activate || []) {
    for (const n of path(s.pos, target, s)) {
      s = clone(s); s.walk.add(ek(s.pos, n)); s.pos = n;
      subs.push({ state: s, action: "move" });
    }
    s = clone(s); s.act.add(target);
    subs.push({ state: s, action: "activate", node: target });
  }
  FRAMES.push(s); SUBS.push(subs);
}

/* ================= RENDER ================= */
const NS = "http://www.w3.org/2000/svg";
const el = (tag, attrs = {}, parent) => {
  const e = document.createElementNS(NS, tag);
  for (const k in attrs) e.setAttribute(k, attrs[k]);
  parent?.appendChild(e); return e;
};
const $ = id => document.getElementById(id);

const edgeEls = {};
for (const [a, b] of EDGES) {
  const A = NODES[a], B = NODES[b];
  edgeEls[ek(a, b)] = el("line", { x1: A.x, y1: A.y, x2: B.x, y2: B.y, class: "edge" }, $("edges"));
}
const nodeEls = {};
for (const id in NODES) {
  const n = NODES[id], g = el("g", { class: "node", transform: `translate(${n.x} ${n.y})` }, $("nodes"));
  if (n.t === "stat") {
    el("circle", { r: 15, class: "body" }, g);
    el("text", { y: 34, "text-anchor": "middle", class: "val" }, g).textContent = `${n.v} ${n.s}`;
  } else if (n.t === "ability") {
    el("circle", { r: 21, class: "body" }, g);
    el("circle", { r: 11, class: "inner" }, g);
    el("text", { y: -30, "text-anchor": "middle", class: "name" }, g).textContent = n.name;
  } else if (n.t === "lock") {
    el("rect", { x: -19, y: -19, width: 38, height: 38, rx: 9, class: "lock" }, g);
    el("text", { y: 6, "text-anchor": "middle", class: "lockt" }, g).textContent = n.name;
  } else {
    el("circle", { r: 8, class: "body" }, g);
  }
  nodeEls[id] = g;
}
/* Other characters: static colour */
for (const key in OTHERS) {
  const o = OTHERS[key];
  o.nodes.forEach(id => nodeEls[id].classList.add("on-" + key));
  for (const [a, b] of EDGES) if (o.nodes.includes(a) && o.nodes.includes(b)) edgeEls[ek(a, b)].classList.add("walk-" + key);
}
function makeTag(name, color) {
  const g = el("g", { class: "tag" }, $("tags"));
  const w = name.length * 9 + 18;
  el("rect", { x: -w / 2, y: 42, width: w, height: 24, rx: 3, fill: color }, g);   // nameplate under the node label
  el("path", { d: "M-6 42 L0 35 L6 42 z", fill: color }, g);
  el("text", { y: 59, "text-anchor": "middle" }, g).textContent = name;
  return g;
}
const place = (g, id) => { g.style.transform = `translate(${NODES[id].x}px, ${NODES[id].y}px)`; };
for (const key in OTHERS) place(makeTag(OTHERS[key].name, COLORS[key]), OTHERS[key].at);
const tag = makeTag(ROUTE.name, COLORS[ROUTE.character]);

function render(s, action, node) {
  const c = ROUTE.character;
  for (const id in nodeEls) nodeEls[id].classList.toggle("on-" + c, s.act.has(id));
  for (const k in edgeEls) if (!OTHERS.wakka || !edgeEls[k].classList.contains("walk-wakka"))
    edgeEls[k].classList.toggle("walk-" + c, s.walk.has(k));

  $("teles").innerHTML = "";
  s.teles.forEach(([a, b], i) => {
    const A = NODES[a], B = NODES[b], my = Math.min(A.y, B.y) - 150, mx = (A.x + B.x) / 2;
    const isNew = action === "teleport" && i === s.teles.length - 1;
    el("path", { d: `M${A.x} ${A.y - 24} Q${mx} ${my} ${B.x} ${B.y - 24}`, class: "tele" + (isNew ? " new" : ""),
                 "marker-end": "url(#arrow)" }, $("teles"));
    const apex = 0.5 * ((A.y + B.y) / 2 - 24) + 0.5 * my;     // top of the curve
    el("text", { x: mx, y: apex - 10, "text-anchor": "middle", class: "tele-label" }, $("teles")).textContent = "Teleport";
  });

  if (action === "teleport") {             // vanish, jump, reappear
    tag.style.opacity = 0;
    setTimeout(() => {
      tag.style.transition = "none"; place(tag, s.pos); tag.getBoundingClientRect();
      tag.style.transition = ""; tag.style.opacity = 1;
    }, 280);
  } else { tag.style.opacity = 1; place(tag, s.pos); }

  if (action === "activate") {
    const n = NODES[node];
    const r = el("circle", { cx: n.x, cy: n.y, r: 14, class: "ring" }, $("fx"));
    setTimeout(() => r.remove(), 750);
  }
}

/* Steps panel */
const stepEls = [];
const startLi = document.createElement("li");
startLi.className = "step"; startLi.innerHTML = `<span class="n">0</span><div class="t">Start on ${nodeName(ROUTE.start)}</div>`;
$("steps").appendChild(startLi); stepEls.push(startLi);
ROUTE.steps.forEach((st, i) => {
  const li = document.createElement("li");
  li.className = "step" + (st.teleport ? " tp" : "");
  const title = st.teleport ? `Teleport → ${nodeName(st.teleport)}` : `Activate ${st.activate.map(nodeName).join(", ")}`;
  const note = [st.note, st.saves ? `skips ${st.saves} moves` : ""].filter(Boolean).join(" · ");
  li.innerHTML = `<span class="n">${i + 1}</span><div class="t">${title}</div>
    ${note ? `<div class="note">${note}</div>` : ""}
    <div class="chips">${Object.entries(st.spheres || {}).map(([k, v]) => `<span class="chip ${k}">${v}× ${k}</span>`).join("")}</div>`;
  $("steps").appendChild(li); stepEls.push(li);
});
stepEls.forEach((li, i) => li.addEventListener("click", () => go(i, true)));

function totals(i) {
  const t = {};
  ROUTE.steps.slice(0, i).forEach(st => { for (const k in st.spheres || {}) t[k] = (t[k] || 0) + st.spheres[k]; });
  $("totals").innerHTML = Object.keys(t).length
    ? Object.entries(t).map(([k, v]) => `<span class="chip ${k}">${v}× ${k}</span>`).join("")
    : `<span style="color:var(--text-dim);font-size:.85rem">None yet</span>`;
}

/* ================= STEPPING ================= */
const sleep = ms => new Promise(r => setTimeout(r, ms));
let cur = 0, token = 0, playing = false;
async function go(i, user) {
  if (user) playing = false;
  i = Math.max(0, Math.min(FRAMES.length - 1, i));
  const my = ++token, animate = i === cur + 1;
  cur = i;
  stepEls.forEach((li, j) => { li.classList.toggle("current", j === i); li.classList.toggle("past", j < i); });
  totals(i);
  if (!animate) { render(FRAMES[i]); return; }
  for (const sub of SUBS[i]) {
    if (my !== token) return;
    render(sub.state, sub.action, sub.node);
    await sleep(sub.action === "teleport" ? 900 : sub.action === "activate" ? 450 : 320);
  }
}
async function playAll() {
  playing = true; await go(0);
  while (playing && cur < FRAMES.length - 1) { await go(cur + 1); await sleep(400); }
  playing = false;
}
$("prev").onclick = () => go(cur - 1, true);
$("next").onclick = () => go(cur + 1, true);
$("reset").onclick = () => go(0, true);
$("play").onclick = playAll;
document.addEventListener("keydown", e => {
  if (e.key === " " || e.key === "ArrowDown") { e.preventDefault(); go(cur + 1, true); }
  else if (e.key === "ArrowUp") { e.preventDefault(); go(cur - 1, true); }
  else if (e.key.toLowerCase() === "r") go(0, true);
  else if (e.key.toLowerCase() === "p") playAll();
});
let wheelAcc = 0, wheelLock = 0;
document.addEventListener("wheel", e => {
  e.preventDefault();
  const now = performance.now(); if (now < wheelLock) return;
  const d = e.deltaMode === 1 ? e.deltaY * 40 : e.deltaY;
  if (Math.sign(d) !== Math.sign(wheelAcc)) wheelAcc = 0;
  wheelAcc += d;
  if (Math.abs(wheelAcc) >= 50) { go(cur + Math.sign(wheelAcc), true); wheelAcc = 0; wheelLock = now + 140; }
}, { passive: false });
go(0);
</script>
</body>
</html>
