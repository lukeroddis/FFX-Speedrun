# Ask Twitch who's streaming FFX speedruns, and publish the list as live.json on the "live-data" branch.
# Switched off: the public site no longer shows live streams, so this only runs by hand (the Run workflow button
# on the Actions tab), for trying the Streams page locally. To switch it back on, restore the schedule below and
# the cron-job.org job (see DEVELOPER_GUIDE.md: "Twitch live check").
# Needs two repository secrets, TWITCH_CLIENT_ID and TWITCH_CLIENT_SECRET.
name: Twitch live check

on:
  # was: schedule: - cron: "4-59/10 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: twitch-live
  cancel-in-progress: true

jobs:
  live:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: Ask Twitch who's live
        run: node .github/scripts/twitch-live.mjs
        env:
          TWITCH_CLIENT_ID: ${{ secrets.TWITCH_CLIENT_ID }}
          TWITCH_CLIENT_SECRET: ${{ secrets.TWITCH_CLIENT_SECRET }}

      - name: Publish live.json to the live-data branch
        working-directory: live-out
        run: |
          git init -q -b live-data
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add live.json
          git commit -q -m "Live streams at $(date -u +%Y-%m-%dT%H:%MZ)"
          # one commit, replaced each time, so the branch never grows
          git push -q -f "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" live-data
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
